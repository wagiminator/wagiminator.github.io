<!DOCTYPE html>
<!--
  Template for a new web app.
  1. Copy this folder to apps/<app-name>/ (lower case, words separated by "-").
  2. Replace every "App Name" and the description below.
  3. Put app-specific CSS into style.css and JavaScript into app.js.
  4. Add the app to the "Web Apps" list in /index.html.
  This folder starts with "_", so GitHub Pages does not publish it.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Name</title>
  <meta name="description" content="One sentence about what the app does.">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="site-bar" aria-label="Breadcrumb">
    <a href="../../">wagiminator</a><span class="sep">/</span><span>Apps</span><span class="sep">/</span><span>App Name</span>
  </nav>

  <main class="app">
    <h1>App Name</h1>
    <p>One sentence about what the app does.</p>
    <!-- App content -->
  </main>

  <footer class="site-footer">
    App Name by <a href="https://github.com/wagiminator">wagiminator</a>.
  </footer>

  <script src="app.js"></script>
</body>
</html>
